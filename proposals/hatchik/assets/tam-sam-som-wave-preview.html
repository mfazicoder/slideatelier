<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TAM/SAM/SOM wave preview</title>
  <style>
    body { background: #F3F1FA; font-family: -apple-system, BlinkMacSystemFont, Inter, sans-serif; margin: 0; padding: 40px; }
    h2 { font-weight: 600; margin: 0 0 16px; color: #1f2540; }
    .panel { background: #fff; padding: 24px; border-radius: 16px; box-shadow: 0 1px 0 rgba(0,0,0,.04); margin-bottom: 32px; }
    .stage { position: relative; width: 640px; height: 640px; background: #F3F1FA; border-radius: 12px; overflow: hidden; }
    .stage svg, .stage img { position: absolute; inset: 0; width: 100%; height: 100%; }
    /* Base TAM/SAM/SOM concentric circles, for the overlay test */
    .base { display:block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="panel">
    <h2>Wave on its own</h2>
    <div class="stage">
      <img src="tam-sam-som-wave.svg" alt="" />
    </div>
  </div>

  <div class="panel">
    <h2>Wave overlaid on the existing concentric TAM/SAM/SOM</h2>
    <div class="stage">
      <!-- Base: the original concentric quarter circles, painted in pale tones -->
      <svg class="base" viewBox="0 0 1200 1200" preserveAspectRatio="xMinYMax meet">
        <circle cx="0" cy="1200" r="1100" fill="#EFEBF8" />
        <circle cx="0" cy="1200" r="760"  fill="#CFC1F1" />
        <circle cx="0" cy="1200" r="420"  fill="#5040E5" />
      </svg>
      <!-- Overlay: the wavy version sits on top -->
      <img src="tam-sam-som-wave.svg" alt="" style="mix-blend-mode: multiply; opacity: 0.85" />
    </div>
  </div>
</body>
</html>
