{% extends "base.html" %}
{% block title %}Log in · slideAtelier{% endblock %}
{% block content %}
<div class="max-w-md mx-auto py-12" style="font-family: 'DM Sans', system-ui, sans-serif;">
  <div class="bg-white border border-stone-200 rounded-lg p-8 shadow-sm">
    <h1 class="text-2xl font-semibold text-stone-900 mb-1">Welcome back</h1>
    <p class="text-sm text-stone-500 mb-6">Log in to keep working on your decks.</p>

    {% if error %}
    <div class="p-3 mb-4 bg-red-50 border border-red-200 rounded text-sm text-red-800">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="next" value="{{ next }}">
      <div>
        <label class="block text-xs font-medium text-stone-700 mb-1" for="email">Email</label>
        <input
          type="email" id="email" name="email"
          value="{{ email or '' }}" required autocomplete="email"
          class="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-amber-600"
        >
      </div>
      <div>
        <label class="block text-xs font-medium text-stone-700 mb-1" for="password">Password</label>
        <input
          type="password" id="password" name="password"
          required autocomplete="current-password"
          class="w-full px-3 py-2 border border-stone-300 rounded text-sm focus:outline-none focus:ring-2 focus:ring-amber-600 focus:border-amber-600"
        >
      </div>
      <button type="submit"
        class="w-full bg-stone-900 text-white text-sm font-medium px-4 py-2 rounded hover:bg-stone-800 transition">
        Log in
      </button>
    </form>

    <p class="text-xs text-stone-500 mt-6">
      No account yet?
      <a href="/signup{% if next != '/workflow' %}?next={{ next | urlencode }}{% endif %}" class="text-amber-700 hover:underline">Create one</a>.
    </p>
  </div>
</div>
{% endblock %}
