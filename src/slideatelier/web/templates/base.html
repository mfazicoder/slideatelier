<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}slideAtelier{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- DM Sans is the default wireframing font: clean, neutral, professional sans-serif.
       The rendered .pptx still uses the chosen template's actual fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    .htmx-request.htmx-indicator { display: inline; }
  </style>
</head>
<body class="bg-stone-50 text-stone-900 min-h-screen">
  <header class="border-b border-stone-200 bg-white">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-baseline gap-6">
        <div>
          <h1 class="text-xl font-semibold text-stone-900">
            <a href="/" class="hover:text-amber-700">slide<span class="text-amber-700">Atelier</span></a>
          </h1>
          <p class="text-xs text-stone-500">consulting-quality presentation generator</p>
        </div>
        <nav class="text-sm text-stone-600 flex gap-4">
          <a href="/" class="hover:text-amber-700">Generate</a>
          <a href="/workflow" class="hover:text-amber-700">Workflow</a>
          <a href="/design-system" class="hover:text-amber-700">Design</a>
          <a href="/library" class="hover:text-amber-700">Library</a>
        </nav>
      </div>
      <div class="text-xs text-stone-500 text-right">
        {% if api_key_set %}
          <div><span class="text-emerald-600">●</span> API key set · <span class="font-mono">{{ model }}</span></div>
        {% else %}
          <div><span class="text-red-600">●</span> API key missing · <span class="font-mono">{{ model }}</span></div>
        {% endif %}
        {% if prompt_version %}
          <div class="text-[10px] text-stone-400 mt-0.5">prompt <span class="font-mono">{{ prompt_version }}</span></div>
        {% endif %}
      </div>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
