# Fly.io deploy config for slideAtelier.
# Customise `app` to a name unique on Fly, then `fly deploy`.
# See DEPLOY.md for full instructions.

app = "slideatelier"
primary_region = "lhr"  # London — low-latency for the user. Change as needed.
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile"

[env]
  SLIDEATELIER_ENV = "production"
  SLIDEATELIER_OUTPUT_DIR = "/app/output"
  SLIDEATELIER_TEMPLATES_DIR = "/app/templates"
  PYTHONUNBUFFERED = "1"

# Secrets (set with `fly secrets set KEY=...`):
#   ANTHROPIC_API_KEY, DOMAIN, SESSION_SECRET, ACME_EMAIL

[[mounts]]
  source = "slideatelier_output"
  destination = "/app/output"
  initial_size = "1gb"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "requests"
    soft_limit = 25
    hard_limit = 50

  # First check: liveness via the lightweight /api/ready probe.
  [[services.http_checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "get"
    path = "/api/ready"
    protocol = "http"

  # Second check: deep health (writability + catalog parse) every 30s.
  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/api/health"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1

[deploy]
  strategy = "rolling"
